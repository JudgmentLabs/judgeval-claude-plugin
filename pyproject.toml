[project]
name = "judgeval-claude-plugin"
dynamic = ["version"]
description = "Claude Code plugins for Judgeval - LLM evaluation, logging, and observability"
authors = [
    { name = "Judgment Labs", email = "support@judgmentlabs.ai" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.urls]
Homepage = "https://judgmentlabs.ai"
Documentation = "https://docs.judgmentlabs.ai"
Repository = "https://github.com/judgmentlabs/judgeval-claude-plugin"

# Single source of truth: the repo-root VERSION file. Do not hardcode a
# version here — bump VERSION (see scripts/sync_version.py) instead.
[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>[0-9]+\.[0-9]+\.[0-9]+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
