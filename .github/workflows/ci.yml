name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate JSON
        run: |
          jq . .claude-plugin/plugin.json > /dev/null
          jq . .claude-plugin/marketplace.json > /dev/null
          echo "JSON files valid"
      
      - name: Check bash syntax
        run: |
          bash -n skills/trace-claude-code/setup.sh
          for f in skills/trace-claude-code/hooks/*.sh; do
            bash -n "$f"
          done
          echo "Bash syntax valid"
      
      - name: Check required files
        run: |
          files=(
            ".claude-plugin/plugin.json"
            ".claude-plugin/marketplace.json"
            "skills/trace-claude-code/SKILL.md"
            "skills/trace-claude-code/setup.sh"
            "skills/trace-claude-code/hooks/common.sh"
            "README.md"
            "LICENSE"
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done
          echo "All required files present"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq uuid-runtime bats

      - name: Run bats test suite
        run: bats --print-output-on-failure --recursive tests
